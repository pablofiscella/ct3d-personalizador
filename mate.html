<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Personalizá tu mate</title>
<style>
  :root{ --navy:#1D194F; --violet:#6B5BD2; --cream:#F6F2EC; --ink:#1B1530; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Titillium Web',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--cream);color:var(--ink)}
  .wrap{max-width:920px;margin:0 auto;padding:16px;display:grid;gap:18px;grid-template-columns:1fr;}
  @media(min-width:760px){.wrap{grid-template-columns:1.1fr .9fr;align-items:start}}
  .preview{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:14px;text-align:center}
  .preview img{width:100%;max-width:520px;border-radius:12px;display:block;margin:0 auto}
  .panel{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.10);padding:20px}
  h1{font-size:1.25rem;margin:.2rem 0 1rem}
  label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
  input[type=text]{width:100%;padding:12px 14px;border:1px solid #d8d4ea;border-radius:10px;font:inherit}
  select,input[type=range]{width:100%}
  .row{display:flex;gap:12px}.row>*{flex:1}
  .hint{font-size:.82rem;opacity:.7;margin:6px 0 0}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .chip{border:1px solid #d8d4ea;background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer;font:inherit;font-size:.85rem}
  .chip.active{background:var(--violet);color:#fff;border-color:var(--violet)}
  .nota{font-size:.8rem;opacity:.7;margin-top:16px;line-height:1.4}
</style>
</head>
<body>
  <div class="wrap">
    <div class="preview">
      <img id="pv" alt="Vista previa del mate grabado">
      <p class="hint">Vista previa — así quedaría el grabado en la virola.</p>
    </div>
    <div class="panel">
      <h1>🧉 Personalizá tu mate</h1>
      <label for="texto">¿Qué querés grabar?</label>
      <input type="text" id="texto" maxlength="32" placeholder="Ej: Catalina" autocomplete="off">
      <label>Tipografía <span style="font-weight:400;opacity:.6">(finas, estilo grabado)</span></label>
      <div class="chips" id="fonts">
        <button class="chip active" data-f="Poppins-Medium.ttf">Fina</button>
        <button class="chip" data-f="DancingScript-VF.ttf">Manuscrita</button>
        <button class="chip" data-f="Fredoka-VF.ttf">Redonda</button>
      </div>
      <label for="size">Tamaño</label>
      <input type="range" id="size" min="0.035" max="0.075" step="0.004" value="0.052">
      <label for="radio">Posición del texto (radio)</label>
      <input type="range" id="radio" min="0.30" max="0.43" step="0.005" value="0.378">
      <p class="hint">Movelo para centrar el texto justo sobre la virola.</p>
      <p class="nota">El grabado se hace a pedido con láser. Lo que escribís acá es lo que vamos a grabar
        en la virola de tu mate. (Más adelante vas a poder sumar una foto chiquita grabada.)</p>
    </div>
  </div>
<script>
(function(){
  var BASE="";  // mismo origen
  var pv=document.getElementById('pv'), txt=document.getElementById('texto'),
      size=document.getElementById('size'), radio=document.getElementById('radio'),
      mate=(new URLSearchParams(location.search)).get('mate')||'demo';
  var font="Poppins-Medium.ttf", t=null;
  function upd(){
    clearTimeout(t);
    t=setTimeout(function(){
      var q="texto="+encodeURIComponent(txt.value)+"&mate="+encodeURIComponent(mate)
           +"&font="+encodeURIComponent(font)+"&size="+encodeURIComponent(size.value)
           +"&r="+encodeURIComponent(radio.value)+"&max=760";
      pv.src=BASE+"/mate/preview?"+q;
      try{ parent.postMessage({type:'ct3d-mate', payload:{mate:mate, texto:txt.value, font:font, size:size.value, r:radio.value}}, '*'); }catch(e){}
    }, 300);
  }
  document.getElementById('fonts').addEventListener('click', function(e){
    var b=e.target.closest('.chip'); if(!b) return;
    document.querySelectorAll('#fonts .chip').forEach(c=>c.classList.remove('active'));
    b.classList.add('active'); font=b.getAttribute('data-f'); upd();
  });
  txt.addEventListener('input', upd); size.addEventListener('input', upd);
  radio.addEventListener('input', upd);
  upd();
})();
</script>
</body>
</html>
