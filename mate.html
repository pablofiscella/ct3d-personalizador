<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Personalizá tu mate</title>
<style>
  :root{ --navy:#1D194F; --violet:#6B5BD2; --cream:#F6F2EC; --ink:#1B1530; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Titillium Web',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--ink)}
  .wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:18px;grid-template-columns:1fr}
  @media(min-width:780px){.wrap{grid-template-columns:1fr 360px;align-items:start}.preview{position:sticky;top:14px}}
  .preview{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:14px;text-align:center}
  .stage{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:1/1;touch-action:none}
  .stage img{width:100%;display:block;border-radius:12px}
  .stage svg{position:absolute;inset:0;width:100%;height:100%}
  .panel{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.10);padding:18px}
  h1{font-size:1.15rem;margin:.1rem 0 1rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:12px 0 5px}
  input[type=text]{width:100%;padding:11px 13px;border:1px solid #d8d4ea;border-radius:10px;font:inherit}
  input[type=range]{width:100%}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{border:1px solid #d8d4ea;background:#fff;border-radius:999px;padding:7px 11px;cursor:pointer;font:inherit;font-size:.85rem}
  .chip.active{background:var(--violet);color:#fff;border-color:var(--violet)}
  .ic{border:1px solid #d8d4ea;background:#fff;border-radius:10px;width:42px;height:42px;font-size:1.2rem;cursor:pointer}
  .hint{font-size:.78rem;opacity:.7;margin:6px 0 0}
  .btn{display:block;width:100%;padding:12px;border:0;border-radius:10px;background:var(--violet);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:14px}
  .btn.sec{background:#fff;color:var(--violet);border:1px solid var(--violet)}
  .selbox{background:#f4f2fb;border:1px solid #e3def5;border-radius:10px;padding:10px;margin-top:10px;display:none}
  .selbox.on{display:block}
  .flex{display:flex;gap:10px;align-items:center}
  #lista{margin-top:10px}
  .lhead{font-weight:600;font-size:.85rem;margin:12px 0 6px}
  .litem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid #e3def5;border-radius:9px;margin-bottom:6px;cursor:pointer}
  .litem.sel{background:#f4f2fb;border-color:var(--violet)}
  .litem button{border:0;background:#fff;border:1px solid #d8d4ea;border-radius:7px;cursor:pointer;padding:4px 9px}
  .obswrap{text-align:left;margin-top:12px}
  .obswrap textarea{width:100%;padding:10px 12px;border:1px solid #d8d4ea;border-radius:10px;font:inherit;resize:vertical}
  .attach{display:inline-block;margin-top:8px;border:1px solid var(--violet);color:var(--violet);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
  .filelist{font-size:.82rem;opacity:.8;margin-top:6px;display:flex;flex-direction:column;gap:3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="preview">
    <div class="stage" id="stage">
      <img id="pv" alt="Vista previa del mate">
      <svg id="ov" viewBox="0 0 460 460" aria-hidden="true"></svg>
    </div>
    <p class="hint">Arrastrá los iconos sobre el aro. Tocá uno para cambiar su tamaño o sacarlo.</p>
    <div class="obswrap">
      <label for="obs">Observaciones <span style="font-weight:400;opacity:.6">(aclaraciones para el grabado)</span></label>
      <textarea id="obs" rows="3" maxlength="600" placeholder="Ej.: en el lugar del corazón quiero la imagen1.png; en la pelota, la imagen2.png; el escudo es la que adjunto. Aclará acá lo que necesites para el grabado."></textarea>
      <label class="attach"><input type="file" id="files" accept="image/*" multiple hidden> 📎 Adjuntar imágenes</label>
      <div id="filelist" class="filelist"></div>
    </div>
  </div>
  <div class="panel">
    <h1>🧉 Personalizá tu mate</h1>
    <label for="texto">Texto de arriba</label>
    <input type="text" id="texto" maxlength="32" placeholder="Ej: Catalina" autocomplete="off">
    <label for="abajo">Texto de abajo (opcional)</label>
    <input type="text" id="abajo" maxlength="32" placeholder="Ej: Feliz cumple" autocomplete="off">
    <label class="flex" style="font-weight:500"><input type="checkbox" id="flip" style="width:auto"> Texto de abajo mirando para arriba</label>

    <label>Tipografía</label>
    <div class="chips" id="fonts">
      <button class="chip active" data-f="Poppins-Medium.ttf">Fina</button>
      <button class="chip" data-f="DancingScript-VF.ttf">Manuscrita</button>
      <button class="chip" data-f="Fredoka-VF.ttf">Redonda</button>
    </div>
    <label for="size">Tamaño del texto</label>
    <input type="range" id="size" min="0.035" max="0.075" step="0.004" value="0.052">
    <label for="radio">Posición del texto (radio)</label>
    <input type="range" id="radio" min="0.30" max="0.43" step="0.005" value="0.378">

    <label>Elegí un icono <span style="font-weight:400;opacity:.6">(fútbol genérico incluido)</span></label>
    <div class="chips" id="palette">
      <button class="ic" data-i="corazon" title="Corazón">❤️</button>
      <button class="ic" data-i="estrella" title="Estrella">⭐</button>
      <button class="ic" data-i="pelota" title="Pelota">⚽</button>
      <button class="ic" data-i="escudo" title="Escudo">🛡️</button>
      <button class="ic" data-i="camiseta" title="Camiseta">👕</button>
      <button class="ic" data-i="corona" title="Corona">👑</button>
      <button class="ic" data-i="flor" title="Flor">🌸</button>
      <button class="ic" data-i="nota" title="Nota">🎵</button>
      <button class="ic" data-i="infinito" title="Infinito">∞</button>
    </div>
    <div class="flex" style="margin-top:8px;gap:16px">
      <label class="flex" style="font-weight:500"><input type="radio" name="fmode" value="1" checked style="width:auto"> Relleno</label>
      <label class="flex" style="font-weight:500"><input type="radio" name="fmode" value="0" style="width:auto"> Contorno</label>
    </div>
    <button class="btn sec" id="agregar" disabled>➕ Agregar icono</button>
    <div id="lista"></div>
    <div class="selbox" id="selbox">
      <div class="flex" style="justify-content:space-between"><strong id="selname">Icono</strong>
        <button class="chip" id="del">Sacar ✕</button></div>
      <label for="isize">Tamaño del icono</label>
      <input type="range" id="isize" min="0.025" max="0.085" step="0.005" value="0.045">
      <label class="flex" style="font-weight:500;margin-top:6px"><input type="checkbox" id="ifill" style="width:auto"> Relleno</label>
      <label class="flex" style="font-weight:500;margin-top:6px"><input type="checkbox" id="iseguir" style="width:auto"> Seguir el aro (girar con la curva)</label>
      <label for="irot">Girar a mano</label>
      <input type="range" id="irot" min="0" max="360" step="5" value="0">
    </div>

    <button class="btn" id="descargar">⬇ Descargar SVG para LightBurn</button>
    <p class="hint">El SVG es el archivo vectorial para grabar (texto en contornos + iconos). El círculo rojo es solo guía.</p>
  </div>
</div>
<script>
(function(){
  var pv=document.getElementById('pv'), ov=document.getElementById('ov'),
      txt=document.getElementById('texto'), abajo=document.getElementById('abajo'),
      flip=document.getElementById('flip'), size=document.getElementById('size'),
      radio=document.getElementById('radio'), selbox=document.getElementById('selbox'),
      isize=document.getElementById('isize'), selname=document.getElementById('selname'),
      stage=document.getElementById('stage'),
      mate=(new URLSearchParams(location.search)).get('mate')||'demo';
  var font="Poppins-Medium.ttf", iconos=[], sel=-1, t=null, drag=-1;
  var EMOJI={corazon:'❤️',estrella:'⭐',pelota:'⚽',escudo:'🛡️',camiseta:'👕',corona:'👑',flor:'🌸',nota:'🎵',infinito:'∞'};
  var VB=460, C=VB/2;

  function qs(){
    return "texto="+encodeURIComponent(txt.value)+"&abajo="+encodeURIComponent(abajo.value)
      +"&flip="+(flip.checked?"1":"0")+"&mate="+encodeURIComponent(mate)
      +"&font="+encodeURIComponent(font)+"&size="+encodeURIComponent(size.value)
      +"&r="+encodeURIComponent(radio.value)+"&iconos="+encodeURIComponent(JSON.stringify(iconos));
  }
  var adjuntos=[];
  function emit(){
    try{ parent.postMessage({type:'ct3d-mate', payload:{
      mate:mate, texto:txt.value, abajo:abajo.value, flip:flip.checked, font:font,
      size:size.value, r:radio.value, iconos:iconos,
      obs:document.getElementById('obs').value, adjuntos:adjuntos.map(f=>f.name)
    }}, '*'); }catch(e){}
  }
  function preview(){ clearTimeout(t); t=setTimeout(function(){ pv.src="/mate/preview?"+qs()+"&max=760"; emit(); }, 250); }
  // observaciones + adjuntar imágenes
  document.getElementById('obs').addEventListener('input', emit);
  document.getElementById('files').addEventListener('change', function(e){
    adjuntos = Array.prototype.slice.call(e.target.files || []);
    document.getElementById('filelist').innerHTML = adjuntos.map(function(f){
      return '📷 '+f.name+' <span style="opacity:.6">('+Math.round(f.size/1024)+' KB)</span>';
    }).join('');
    emit();
  });
  function R(){ return parseFloat(radio.value)*VB; }
  function pos(ang){ var a=ang*Math.PI/180; return [C+R()*Math.sin(a), C-R()*Math.cos(a)]; }

  function drawOverlay(){
    var s='';
    iconos.forEach(function(ic,i){
      var p=pos(ic.ang), r=Math.max(13, ic.size*VB*1.15);
      // solo un aro para arrastrar (sin emoji de color): así se ve el icono grabado real debajo
      s+='<g data-i="'+i+'" style="cursor:grab">';
      s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+r.toFixed(1)+'" fill="rgba(0,0,0,0.001)" stroke="'+(i===sel?'rgba(107,91,210,.55)':'rgba(107,91,210,.22)')+'" stroke-width="'+(i===sel?1.5:1)+'" stroke-dasharray="'+(i===sel?'0':'2 4')+'"/></g>';
    });
    ov.innerHTML=s;
  }
  function selUpdate(){
    if(sel<0){ selbox.classList.remove('on'); return; }
    selbox.classList.add('on'); selname.textContent='Icono: '+(EMOJI[iconos[sel].n]||'');
    isize.value=iconos[sel].size;
    document.getElementById('ifill').checked = iconos[sel].relleno !== false;
    document.getElementById('iseguir').checked = !!iconos[sel].seguir;
    document.getElementById('irot').value = iconos[sel].rot || 0;
  }
  var NOMBRE={corazon:'Corazón',estrella:'Estrella',pelota:'Pelota',escudo:'Escudo',camiseta:'Camiseta',corona:'Corona',flor:'Flor',nota:'Nota',infinito:'Infinito'};
  function renderLista(){
    var L=document.getElementById('lista');
    if(!iconos.length){ L.innerHTML=''; return; }
    L.innerHTML='<div class="lhead">Iconos agregados ('+iconos.length+')</div>'+
      iconos.map(function(ic,i){
        return '<div class="litem'+(i===sel?' sel':'')+'" data-li="'+i+'">'+
          '<span>'+(EMOJI[ic.n]||'')+' '+(NOMBRE[ic.n]||ic.n)+' · '+(ic.relleno!==false?'relleno':'contorno')+'</span>'+
          '<button data-del="'+i+'" title="Sacar">✕</button></div>';
      }).join('');
  }
  document.getElementById('lista').addEventListener('click',function(e){
    var del=e.target.closest('[data-del]');
    if(del){ var j=+del.getAttribute('data-del'); iconos.splice(j,1); sel=(sel===j?-1:(sel>j?sel-1:sel)); refresh(); return; }
    var it=e.target.closest('[data-li]');
    if(it){ sel=+it.getAttribute('data-li'); refresh(); }
  });
  function refresh(){ drawOverlay(); selUpdate(); renderLista(); preview(); }

  // flujo: elegir icono -> relleno/contorno -> Agregar (sin apilar)
  var addSel=null, agregar=document.getElementById('agregar'), ifill=document.getElementById('ifill');
  function fmode(){ return document.querySelector('input[name=fmode]:checked').value==="1"; }
  function freeAngle(){
    var pref=[90,270,45,315,135,225,60,300,120,240,0,180];
    if(!iconos.length) return 90;
    var best=pref[0], bd=-1;
    pref.forEach(function(a){ var md=360; iconos.forEach(function(ic){ var d=Math.abs(((a-ic.ang+540)%360)-180); if(d<md)md=d; }); if(md>bd){bd=md;best=a;} });
    return best;
  }
  document.getElementById('palette').addEventListener('click',function(e){
    var b=e.target.closest('.ic'); if(!b) return;
    document.querySelectorAll('#palette .ic').forEach(c=>c.classList.remove('active'));
    b.classList.add('active'); addSel=b.getAttribute('data-i'); agregar.disabled=false;
  });
  agregar.addEventListener('click',function(){
    if(!addSel) return;
    iconos.push({n:addSel, ang:freeAngle(), size:0.045, relleno:fmode()});
    sel=iconos.length-1; refresh();
  });
  document.getElementById('del').addEventListener('click',function(){
    if(sel<0)return; iconos.splice(sel,1); sel=-1; refresh();
  });
  isize.addEventListener('input',function(){ if(sel>=0){ iconos[sel].size=parseFloat(isize.value); refresh(); }});
  ifill.addEventListener('change',function(){ if(sel>=0){ iconos[sel].relleno=ifill.checked; refresh(); }});
  document.getElementById('iseguir').addEventListener('change',function(){ if(sel>=0){ iconos[sel].seguir=this.checked; refresh(); }});
  document.getElementById('irot').addEventListener('input',function(){ if(sel>=0){ iconos[sel].rot=parseInt(this.value); iconos[sel].seguir=false; refresh(); }});

  // arrastre en círculo
  function evAng(e){
    var rect=stage.getBoundingClientRect();
    var x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left, y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
    x=x/rect.width*VB; y=y/rect.height*VB;
    var ang=Math.atan2(x-C, -(y-C))*180/Math.PI; if(ang<0)ang+=360; return ang;
  }
  ov.addEventListener('pointerdown',function(e){
    var g=e.target.closest('g[data-i]'); if(!g)return;
    drag=parseInt(g.getAttribute('data-i')); sel=drag; selUpdate(); drawOverlay();
    ov.setPointerCapture(e.pointerId); e.preventDefault();
  });
  ov.addEventListener('pointermove',function(e){
    if(drag<0)return; iconos[drag].ang=Math.round(evAng(e)); drawOverlay();
    clearTimeout(t); t=setTimeout(function(){ pv.src="/mate/preview?"+qs()+"&max=760"; },120);
  });
  ov.addEventListener('pointerup',function(e){ if(drag>=0){drag=-1; preview();} });

  // controles de texto
  document.getElementById('fonts').addEventListener('click',function(e){
    var b=e.target.closest('.chip'); if(!b)return;
    document.querySelectorAll('#fonts .chip').forEach(c=>c.classList.remove('active'));
    b.classList.add('active'); font=b.getAttribute('data-f'); preview();
  });
  [txt,abajo].forEach(el=>el.addEventListener('input',preview));
  flip.addEventListener('change',preview);
  [size,radio].forEach(el=>el.addEventListener('input',refresh));
  document.getElementById('descargar').addEventListener('click',function(){
    window.open("/mate/svg?"+qs(),"_blank");   // el diámetro lo toma de la config del mate (admin)
  });
  // modo embebido en la tienda: el cliente no ve el botón de SVG (eso es para el local)
  if((new URLSearchParams(location.search)).get('embed')){ document.getElementById('descargar').style.display='none'; }

  // Autoajuste de altura: avisar al contenedor (ficha) el alto real del contenido para que
  // el iframe crezca y NO aparezca barra de scroll (el alto varía al sumar iconos, etc.).
  function postSize(){
    try{ if(window.parent!==window) window.parent.postMessage({type:'ct3d-mate-size', h: Math.ceil(document.body.scrollHeight)}, '*'); }catch(e){}
  }
  window.addEventListener('load', postSize);
  window.addEventListener('resize', postSize);
  if(window.ResizeObserver){ try{ new ResizeObserver(postSize).observe(document.body); }catch(e){} }
  setTimeout(postSize, 300); setTimeout(postSize, 1200);

  refresh();
})();
</script>
</body>
</html>
