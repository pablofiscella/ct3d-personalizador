<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{{TITULO}}</title>
<style>
  :root{
    --bg:#f6f1e7; --card:#fffdf8; --ink:#3a3330; --muted:#8a807a;
    --ac:#c8674e; --ac2:#6b7a4f; --line:#e7ddcd; --shadow:0 6px 22px rgba(60,40,20,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:var(--bg); overscroll-behavior:none;
    height:100dvh; display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:12px; padding:12px 16px; flex:0 0 auto;
    background:var(--card); border-bottom:1px solid var(--line); z-index:5;
  }
  header h1{font-size:19px; margin:0; font-weight:800; letter-spacing:.2px; flex:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .btn{
    border:none; border-radius:14px; padding:11px 15px; font-size:15px; font-weight:700;
    cursor:pointer; background:var(--line); color:var(--ink); min-height:46px;
  }
  .btn.ac{background:var(--ac); color:#fff}
  .btn.gh{background:transparent; border:1.5px solid var(--line)}
  .wrap{flex:1 1 auto; min-height:0; overflow:auto; max-width:1100px; margin:0 auto; width:100%; padding:14px}
  /* galería */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px;
    box-shadow:var(--shadow); cursor:pointer; text-align:center; transition:transform .08s;
  }
  .card:active{transform:scale(.97)}
  .card img{width:100%; aspect-ratio:1; object-fit:contain; border-radius:10px}
  .card .dif{margin-top:8px; font-size:13px; color:var(--muted); font-weight:700}
  .card .stars{color:var(--ac); letter-spacing:2px; font-size:13px}
  .intro{color:var(--muted); font-size:15px; margin:2px 0 16px}
  /* pintar: rieles laterales (botones izq · colores der) + canvas que entra en el alto */
  #paint{display:none}
  #paint.on{display:flex; height:100%}
  #gallery.off{display:none}
  .paint-layout{display:flex; gap:10px; width:100%; height:100%; align-items:stretch}
  .rail{display:flex; flex-direction:column; gap:8px; flex:0 0 auto; overflow-y:auto; overflow-x:visible;
    padding:8px; align-items:center}
  .rail-right{display:grid; grid-template-columns:repeat(2,auto); gap:10px 12px; align-content:start}
  .swatch.custom{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); position:relative; overflow:hidden}
  .swatch.custom input{position:absolute; inset:-4px; opacity:0; cursor:pointer}
  .swatch.custom::after{content:"+"; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-weight:800; text-shadow:0 0 2px #0007}
  .canvasbox{flex:1 1 auto; min-width:0; display:flex; align-items:center; justify-content:center;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px; box-shadow:var(--shadow);
    overflow:hidden; position:relative}
  canvas{max-width:100%; max-height:100%; touch-action:none; border-radius:8px; transition:transform .04s linear;
    cursor:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABUUlEQVR4nO2WoU7DQByHvxEeoRp9D4A8S0NmJqbmUHPDTKyO4DpBSJibwk1NEJKFgK3co0zxAoehy7W9tlf6vyHg53p3ue/L7y5t4T+Bo7U2vwr/fHw1TRJnIeG78QKA3XhR20QQARuep05CXEBrbZIkYbhdVuZcEgNJeKwjc5s8H5/TNKXcBMBwuyTLsgEINhDryLw8XPKU3hzHfJoQEcjhAD4Sog3Y8DxNEjYcet4BF9zOaL6nfCdsOPRooA0OxSZccPhhAz5wO6P5nvfs4GR1bkAS3llAGt5JIATcWyAU3EsgJLxVIDS8UeAU8FqBU8FrBfJNQ8MBzssDsY7Mejb53nxD27u+DxxaLuF6NqltQgIOpW+BUsq83V9VFk1XxSak4OBo4Pruo7LIbkIS7hRoijQcrCNQShX+VvOjmK42AOLgVgGAi+gQDFyJS+BP5AuWQdfrEvF3ewAAAABJRU5ErkJggg==") 2 30, crosshair}
  .tbtn{width:60px; min-height:54px; border-radius:14px; border:1.5px solid var(--line);
    background:var(--card); color:var(--ink); cursor:pointer; padding:6px 2px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
  .tbtn span{font-size:20px; line-height:1}
  .tbtn small{font-size:9px; font-weight:700}
  .tbtn.ac{background:var(--ac); color:#fff; border-color:var(--ac)}
  .swatch{width:46px; height:46px; border-radius:50%; border:3px solid #fff; flex:0 0 auto;
    box-shadow:0 0 0 1.5px var(--line); cursor:pointer; padding:0}
  .swatch.on{box-shadow:0 0 0 3px var(--ac); transform:scale(1.08)}
  .swatch.eraser{background:#fff !important; position:relative}
  .swatch.eraser::after{content:"⌫"; position:absolute; inset:0; display:grid; place-items:center; color:#b9ad9c}
  @media (prefers-color-scheme:dark){
    :root{--bg:#221f1c; --card:#2c2825; --ink:#efe7dc; --muted:#a89e93; --line:#3c352f}
  }
</style>
</head>
<body>
<header>
  <h1 id="titulo">{{TITULO}}</h1>
  <a id="pdf" class="btn ac" href="kit.zip" download>⬇️ PDF</a>
</header>

<div class="wrap">
  <section id="gallery">
    <p class="intro">Elegí una mándala y pintala tocando cada zona. Cuando quieras, descargá el <b>PDF</b> para imprimirlas.</p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="paint">
    <div class="paint-layout">
      <div class="rail rail-left">
        <button class="tbtn" id="volver" title="Elegir otra mándala"><span>←</span><small>Otra</small></button>
        <button class="tbtn" id="undo" title="Deshacer"><span>↩️</span><small>Deshacer</small></button>
        <button class="tbtn" id="limpiar" title="Limpiar"><span>🧽</span><small>Limpiar</small></button>
        <button class="tbtn ac" id="guardar" title="Guardar dibujo"><span>⬇️</span><small>Guardar</small></button>
      </div>
      <div class="canvasbox"><canvas id="lienzo"></canvas></div>
      <div class="rail rail-right" id="palette"></div>
    </div>
  </section>
</div>

<script>window.MANDALAS = {{NIVELES}}; window.NOMBRE = {{NOMBRE}};</script>
<script src="player.js?v={{V}}"></script>
</body>
</html>
