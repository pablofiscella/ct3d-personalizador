<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personalizá tu diseño — CASATRIDIMENSIONAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F6F2EC;--ink:#1B1530;--violet:#6B5BD2;--violet2:#4D3FB0;--line:#e3def5;--navy:#1D194F}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Titillium Web',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--ink)}
  .wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:18px;grid-template-columns:1fr}
  @media(min-width:780px){.wrap{grid-template-columns:1fr 340px;align-items:start}.preview{position:sticky;top:14px}}
  .preview{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:14px;text-align:center}
  .preview__img-wrap{position:relative}
  .preview img{max-width:100%;height:auto;border-radius:8px;display:block;margin:0 auto;background:#faf8f4;min-height:220px}
  .preview__loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.72);border-radius:8px}
  .preview__loading.on{display:flex}
  .preview__spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--violet);border-radius:50%;animation:pv-spin .8s linear infinite}
  @keyframes pv-spin{to{transform:rotate(360deg)}}
  .panel{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.10);padding:16px}
  h1{font-size:1.05rem;margin:0 0 4px}
  .sub{font-size:.85rem;color:#6b6580;margin:0 0 14px}
  label{display:block;font-weight:600;font-size:.86rem;margin:12px 0 5px}
  input[type=text],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fcfbff}
  input[type=text]:focus,select:focus{outline:none;border-color:var(--violet)}
  .tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .tab{padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font:inherit;font-size:.82rem;font-weight:600;color:#6b6580}
  .tab.active{background:var(--violet);border-color:var(--violet);color:#fff}
  .btn{width:100%;margin-top:16px;padding:11px 16px;border:0;border-radius:11px;background:var(--violet);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  .btn:hover{background:var(--violet2)}
  .hint{font-size:.8rem;color:#6b6580;margin:10px 0 0;min-height:1.2em}
  .note{font-size:.78rem;color:#8a84a0;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="preview">
    <div class="tabs" id="tabs" style="display:none"></div>
    <div class="preview__img-wrap">
      <img id="pv" alt="Vista previa">
      <div class="preview__loading" id="pv-loading"><span class="preview__spinner"></span></div>
    </div>
    <p class="note">La marca de agua es solo de la muestra; lo que se compra sale limpio.</p>
  </div>
  <div class="panel">
    <h1 id="titulo">Personalizá tu diseño</h1>
    <p class="sub">Escribí el nombre y mirá la vista previa actualizarse.</p>
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" placeholder="Ej.: Catalina" autocomplete="off">
    <div id="campo-edad" style="display:none">
      <label for="edad">Edad</label>
      <select id="edad"></select>
    </div>
    <div id="campos-extra"></div>
    <button class="btn" id="confirmar" type="button">Confirmar diseño</button>
    <p class="hint" id="hint"></p>
  </div>
</div>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var TIPO = (qs.get('tipo')||'milestone').toLowerCase();
  var TEMA = (qs.get('tema')||'safari').toLowerCase();
  var pv = document.getElementById('pv');
  var pvLoading = document.getElementById('pv-loading');
  var inp = document.getElementById('nombre');
  var hint = document.getElementById('hint');
  var titulo = document.getElementById('titulo');
  var tabsBox = document.getElementById('tabs');
  var camposBox = document.getElementById('campos-extra');

  // Selector de edad (16-jul-2026, Pablo: "si voy al editor solo muestra
  // nombre") — EDAD se leía UNA vez de la URL y quedaba congelada: no había
  // ningún control para cambiarla acá, aunque el tipo la declarara en sus
  // campos (actividades-web y otros). "edad" quedaba afuera de CAMPOS_EXTRA
  // a propósito (ver ESTRUCTURALES) asumiendo un control estructural propio
  // que nunca se construyó. Rango 3-12 (pedido de Pablo) — se muestra SOLO
  // si el tipo declara "edad" entre sus campos (chequeo tras /tipos).
  var EDAD_MIN = 3, EDAD_MAX = 12, EDAD_DEFAULT = 5;
  var campoEdadBox = document.getElementById('campo-edad');
  var selEdad = document.getElementById('edad');
  (function(){
    var opts = '';
    for(var e=EDAD_MIN; e<=EDAD_MAX; e++){ opts += '<option value="'+e+'">'+e+' años</option>'; }
    selEdad.innerHTML = opts;
  })();
  var edadQS = parseInt(qs.get('edad'), 10);
  var EDAD = (edadQS >= EDAD_MIN && edadQS <= EDAD_MAX) ? String(edadQS) : String(EDAD_DEFAULT);
  selEdad.value = EDAD;
  selEdad.addEventListener('change', function(){ EDAD = selEdad.value; refrescar(); });

  // Campos propios del tipo más allá de nombre/edad/año (ej. menu_entrada/menu_plato del
  // menú infantil) — se piden a /tipos y se arman inputs solos, sin tocar este archivo
  // cada vez que un tipo nuevo suma un campo personalizable.
  var CAMPOS_EXTRA = [];   // [{nombre, label}], se llena tras el fetch de /tipos
  var ESTRUCTURALES = {nombre:1, edad:1, anyo:1};
  function pintarCamposExtra(){
    camposBox.innerHTML = CAMPOS_EXTRA.map(function(c){
      return '<label for="ce-'+c.nombre+'">'+c.label+'</label>'+
             '<input type="text" id="ce-'+c.nombre+'" data-campo="'+c.nombre+'" autocomplete="off">';
    }).join('');
    camposBox.querySelectorAll('input').forEach(function(el){ el.addEventListener('input', refrescar); });
  }
  function valoresCamposExtra(){
    var out = {};
    CAMPOS_EXTRA.forEach(function(c){
      var el = document.getElementById('ce-'+c.nombre);
      if(el && el.value.trim()) out[c.nombre] = el.value.trim();
    });
    return out;
  }

  // Cada cambio de pestaña/nombre pide una imagen nueva al servidor y puede tardar
  // (el cuaderno de actividades renderiza la página en el momento) — sin esto la imagen
  // vieja se queda quieta y parece colgado. Overlay con spinner hasta que cargue.
  pv.addEventListener('load', function(){ pvLoading.classList.remove('on'); });
  pv.addEventListener('error', function(){ pvLoading.classList.remove('on'); });
  function cargarPreview(){ pvLoading.classList.add('on'); pv.src = previewUrl(); }

  var LABELS = { milestone:'Personalizá tus tarjetas mes a mes', actividades:'Personalizá las actividades', cartel:'Personalizá el cartel' };
  titulo.textContent = LABELS[TIPO] || 'Personalizá tu diseño';

  // Páginas (piezas) reales del tipo — se piden al servidor: cada tipo tiene su propia
  // cantidad (actividades puede tener 13-29 según la edad, corona 2, antifaces 3,
  // certificado 1…). Antes esto estaba hardcodeado a 2 fijas ("actividades") o 1
  // ("el resto"), así que el editor no mostraba las piezas reales de un tipo nuevo.
  var PAGINAS = [{i:0,t:''}];   // placeholder mientras carga / si falla el fetch
  var pagina = 0;

  function pintarTabs(){
    tabsBox.innerHTML = '';
    if(PAGINAS.length > 1){
      tabsBox.style.display = 'flex';
      PAGINAS.forEach(function(p,idx){
        var b=document.createElement('button');
        b.className='tab'+(idx===pagina?' active':''); b.textContent=p.t||('Página '+(idx+1)); b.type='button';
        b.onclick=function(){ pagina=idx; [].forEach.call(tabsBox.children,function(c){c.classList.remove('active');}); b.classList.add('active'); refrescar(); };
        tabsBox.appendChild(b);
      });
    } else {
      tabsBox.style.display = 'none';
    }
  }

  function previewUrl(){
    var nombre = (inp.value||'').trim() || 'Tomás';
    var q = 'tipo='+encodeURIComponent(TIPO)+'&tema='+encodeURIComponent(TEMA)
          + '&nombre='+encodeURIComponent(nombre)+'&edad='+encodeURIComponent(EDAD)
          + '&pieza='+PAGINAS[pagina].i+'&max=820&cb='+Date.now();
    var extra = valoresCamposExtra();
    for(var k in extra) q += '&'+encodeURIComponent(k)+'='+encodeURIComponent(extra[k]);
    return '/preview?'+q;
  }
  // A6: origin real del padre (la tienda), nunca "*".
  var PARENT_ORIGIN=(function(){try{var o=new URL(document.referrer).origin;
    return o.endsWith('casatridimensional.com.ar')?o:'https://casatridimensional.com.ar';}
    catch(e){return 'https://casatridimensional.com.ar';}})();
  function emit(confirm){
    try{
      if(window.parent!==window){
        var data = {nombre:(inp.value||'').trim()};
        var extra = valoresCamposExtra();
        for(var k in extra) data[k] = extra[k];
        window.parent.postMessage({type:'ct3d-kit', confirm:!!confirm,
          payload:{tema:TEMA, edad:EDAD, data:data, over:{}}}, PARENT_ORIGIN);
      }
    }catch(e){}
  }
  var t=null;
  function refrescar(){ clearTimeout(t); t=setTimeout(cargarPreview, 350); emit(false); }

  inp.addEventListener('input', function(){
    refrescar();
    var ok=(inp.value||'').trim();
    hint.textContent = ok ? '' : 'Escribí el nombre para personalizarlo.';
  });
  document.getElementById('confirmar').addEventListener('click', function(){
    var nombre=(inp.value||'').trim();
    if(!nombre){ hint.textContent='⚠ Escribí el nombre antes de confirmar.'; inp.focus(); return; }
    emit(true);
    hint.textContent='✓ Diseño confirmado.';
  });

  var pPiezas = fetch('/piezas?tipo='+encodeURIComponent(TIPO)+'&tema='+encodeURIComponent(TEMA))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.ok && Array.isArray(d.piezas) && d.piezas.length){
        PAGINAS = d.piezas.map(function(p){ return {i:p.idx, t:p.label||''}; });
      }
    })
    .catch(function(){});

  var pTipos = fetch('/tipos')
    .then(function(r){ return r.json(); })
    .then(function(d){
      var info = d && d.ok && d.tipos && d.tipos[TIPO];
      if(!info) return;
      if((info.campos || []).indexOf('edad') !== -1){
        campoEdadBox.style.display = '';
      }
      var labels = info.campos_labels || {};
      CAMPOS_EXTRA = (info.campos || []).filter(function(c){ return !ESTRUCTURALES[c]; })
        .map(function(c){ return {nombre:c, label: labels[c] || (c.charAt(0).toUpperCase()+c.slice(1).replace(/_/g,' '))}; });
    })
    .catch(function(){});

  Promise.all([pPiezas, pTipos]).then(function(){
    pintarTabs();
    pintarCamposExtra();
    cargarPreview();
  });
})();
</script>
</body>
</html>
