<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{{TITULO}}</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --fondo:#0e1424; --panel:#182238; --texto:#eef3ff; --suave:#9fb0cc;
          --acento:#ffcf4a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--fondo); color:var(--texto); display:flex;
         align-items:center; justify-content:center; padding:24px;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .caja { background:var(--panel); border-radius:22px; padding:34px 28px 30px;
          max-width:420px; width:100%; text-align:center;
          box-shadow:0 18px 50px rgba(0,0,0,.45); }
  .candado { font-size:44px; line-height:1; margin-bottom:14px; }
  h1 { font-size:21px; margin:0 0 10px; line-height:1.3; }
  p { color:var(--suave); font-size:15px; line-height:1.55; margin:0 0 18px; }
  .cuenta { display:inline-block; background:rgba(255,207,74,.13); color:var(--acento);
            border-radius:9px; padding:7px 13px; font-size:14.5px; margin-bottom:20px;
            font-variant-numeric:tabular-nums; word-break:break-all; }
  #boton { display:flex; justify-content:center; min-height:44px; }
  .aviso { margin-top:20px; font-size:13px; color:var(--suave); }
  .error { display:none; margin-top:16px; background:rgba(255,90,90,.13);
           color:#ff9d9d; border-radius:10px; padding:11px 13px; font-size:14px; }
</style>
</head>
<body>
  <!-- Los valores viajan como atributos, NO interpolados adentro del <script>. Dentro de
       un <script> las entidades HTML no se decodifican, así que escapar «"» a &quot; no
       protege: deja el valor corrupto y la seguridad colgada de un razonamiento sutil
       sobre dos contextos de escape distintos. Con data-* hay UN solo contexto —HTML— y
       el JS lee el valor ya limpio del DOM. -->
  <div class="caja" id="caja"
       data-client-id="{{CLIENT_ID}}"
       data-volver="{{VOLVER}}"
       data-error="{{TXT_ERROR}}"
       data-lang="{{LANG}}">
    <div class="candado">🔒</div>
    <h1>{{H1}}</h1>
    <p>{{BAJADA}}</p>
    {{CUENTA}}
    <div id="boton"></div>
    <div class="error" id="err"></div>
    <div class="aviso">{{AVISO}}</div>
  </div>

<script>
// El link ya no es la llave: la llave es el mail. Se entra con Google y el motor emite
// su propia cookie — no se crea ninguna cuenta de Casatridimensional, que es
// exactamente lo que se pidió: el comprador de Etsy no tiene por qué registrarse acá.
var CAJA      = document.getElementById("caja");
var CLIENT_ID = CAJA.getAttribute("data-client-id");
var VOLVER    = CAJA.getAttribute("data-volver") || "/";
var TXT_ERROR = CAJA.getAttribute("data-error");
var LANG      = CAJA.getAttribute("data-lang") || "es";

function entrar(resp) {
  var e = document.getElementById("err");
  e.style.display = "none";
  fetch("/acceso/google", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    // La cookie es del dominio padre; `same-origin` alcanza y es lo más cerrado.
    credentials: "same-origin",
    body: JSON.stringify({ credential: resp.credential, volver: VOLVER })
  }).then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ok) { window.location.replace(VOLVER || "/"); return; }
      e.textContent = (d && d.error) || TXT_ERROR;
      e.style.display = "block";
    })
    .catch(function () { e.textContent = TXT_ERROR; e.style.display = "block"; });
}

window.onload = function () {
  if (!window.google || !google.accounts) {
    var e = document.getElementById("err");
    e.textContent = TXT_ERROR; e.style.display = "block";
    return;
  }
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: entrar });
  google.accounts.id.renderButton(document.getElementById("boton"),
    { theme: "filled_blue", size: "large", shape: "pill", text: "signin_with",
      locale: LANG });
};
</script>
</body>
</html>
