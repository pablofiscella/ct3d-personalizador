<!-- Editor de calendario embebible en modal - SIMPLE Y AUTOMÁTICO -->
<div id="editor-calendario-wrap" style="padding:20px;max-height:80vh;overflow-y:auto;font-family:Nunito,sans-serif">
  <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-bottom:20px">
    <!-- Panel izquierdo: imagen + año -->
    <div>
      <h3 style="font-size:14px;margin-bottom:10px">1. Plantilla</h3>
      <label style="display:block;padding:12px;border:2px dashed #4FA11C;border-radius:8px;cursor:pointer;text-align:center;font-size:13px;background:#f9f9f9;margin-bottom:15px">
        📤 Elegir imagen (A4: 1240×1754)
        <input type="file" id="cal-editor-file" accept="image/*" style="display:none">
      </label>
      <div id="cal-editor-preview" style="max-height:250px;overflow:hidden;border-radius:6px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;min-height:100px">
        Preview de la imagen
      </div>
      
      <h3 style="font-size:14px;margin-top:15px;margin-bottom:10px">2. Año</h3>
      <input type="number" id="cal-editor-anyo" value="2026" min="2024" max="2050" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:13px;font-weight:600">
    </div>

    <!-- Panel derecho: parámetros (colapsables) -->
    <div>
      <h3 style="font-size:14px;margin-bottom:10px">Parámetros avanzados</h3>
      <details style="font-size:12px;border:1px solid #ddd;border-radius:6px;padding:10px">
        <summary style="cursor:pointer;font-weight:600">⚙️ Mostrar/Ocultar</summary>
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:10px">
          <div>
            <label>Mes - Tamaño fuente:</label>
            <input type="range" id="cal-editor-month-size" min="40" max="120" value="110" style="width:100%">
            <span id="cal-editor-month-size-val">110</span>px
          </div>
          <div>
            <label>Días semana - Tamaño:</label>
            <input type="range" id="cal-editor-weekday-size" min="14" max="40" value="24" style="width:100%">
            <span id="cal-editor-weekday-size-val">24</span>px
          </div>
          <div>
            <label>Números - Tamaño:</label>
            <input type="range" id="cal-editor-day-size" min="16" max="48" value="28" style="width:100%">
            <span id="cal-editor-day-size-val">28</span>px
          </div>
          <div>
            <label>Grid X:</label>
            <input type="number" id="cal-editor-grid-x" value="271" style="width:100%;padding:4px">
          </div>
          <div>
            <label>Grid Y:</label>
            <input type="number" id="cal-editor-grid-y" value="399" style="width:100%;padding:4px">
          </div>
        </div>
      </details>
    </div>
  </div>

  <!-- Botones de acción -->
  <div style="display:flex;gap:10px;justify-content:flex-end">
    <button id="cal-editor-generar" class="btn-primary" style="padding:12px 24px;border:none;border-radius:6px;background:#4FA11C;color:white;cursor:pointer;font-weight:600;font-size:13px" disabled>
      🚀 Generar 12 meses
    </button>
    <button id="cal-editor-cerrar" style="padding:12px 24px;border:1px solid #ccc;border-radius:6px;background:#f9f9f9;cursor:pointer;font-weight:600;font-size:13px">
      Cerrar
    </button>
  </div>

  <div id="cal-editor-status" style="margin-top:12px;font-size:12px;min-height:20px;text-align:center"></div>
</div>

<script>
(function(){
  const fileInput = document.getElementById('cal-editor-file');
  const preview = document.getElementById('cal-editor-preview');
  const generarBtn = document.getElementById('cal-editor-generar');
  const cerrarBtn = document.getElementById('cal-editor-cerrar');
  const statusDiv = document.getElementById('cal-editor-status');
  const anyoInput = document.getElementById('cal-editor-anyo');
  
  let selectedFile = null;

  // Al seleccionar imagen: habilita botón "Generar"
  fileInput.addEventListener('change', (e) => {
    selectedFile = e.target.files[0];
    if (selectedFile) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        preview.innerHTML = '<img src="' + ev.target.result + '" style="width:100%;border-radius:4px">';
        statusDiv.textContent = '✓ Imagen seleccionada: ' + selectedFile.name;
        generarBtn.disabled = false;  // Habilita el botón
      };
      reader.readAsDataURL(selectedFile);
    }
  });

  // Actualizar valores mostrados en parámetros
  document.getElementById('cal-editor-month-size').addEventListener('input', (e) => {
    document.getElementById('cal-editor-month-size-val').textContent = e.target.value;
  });
  document.getElementById('cal-editor-weekday-size').addEventListener('input', (e) => {
    document.getElementById('cal-editor-weekday-size-val').textContent = e.target.value;
  });
  document.getElementById('cal-editor-day-size').addEventListener('input', (e) => {
    document.getElementById('cal-editor-day-size-val').textContent = e.target.value;
  });

  // Click "Generar 12 meses" - automático
  generarBtn.addEventListener('click', async () => {
    if (!selectedFile) {
      statusDiv.textContent = '✕ Selecciona una imagen';
      return;
    }
    
    generarBtn.disabled = true;
    generarBtn.textContent = '⏳ Generando...';
    statusDiv.textContent = '⏳ Generando 12 meses automáticamente...';
    
    try {
      const fd = new FormData();
      fd.append('plantilla', selectedFile);
      fd.append('tema', window.TEMA_ACTUAL);
      fd.append('anyo', anyoInput.value);
      
      const r = await fetch('/kit-admin/calendario-generar', {method: 'POST', body: fd});
      const jr = await r.json();
      
      if (jr.ok) {
        statusDiv.textContent = '✅ ' + jr.piezas.length + ' meses generados. Actualizando panel...';
        setTimeout(() => {
          // Recargar las piezas en el dashboard
          if (window.cargarPiezas) {
            window.cargarPiezas().then(() => {
              cerrarBtn.click();
            });
          } else {
            cerrarBtn.click();
          }
        }, 800);
      } else {
        statusDiv.textContent = '✕ Error: ' + (jr.error || 'desconocido');
      }
    } catch (e) {
      statusDiv.textContent = '✕ ' + e;
    }
    
    generarBtn.disabled = false;
    generarBtn.textContent = '🚀 Generar 12 meses';
  });

  cerrarBtn.addEventListener('click', () => {
    document.getElementById('cal-editor-modal').close();
  });
})();
</script>
