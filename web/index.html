<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personalizá tu invitación — Un Añito Salvaje</title>
<style>
  :root{
    --cream:#F4EFE6; --brown:#6F4E37; --terra:#C8674E; --olive:#6B7A4F; --sage:#8A9A5B;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Poppins',system-ui,sans-serif; color:var(--brown);
    background:#efe7da; background-image:radial-gradient(circle at 20% 10%, #f6f1e7 0, #e9e0d1 70%);
    min-height:100vh;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:28px 20px 60px}
  header{text-align:center; margin-bottom:22px}
  header h1{font-family:'Fredoka',sans-serif; font-weight:600; color:var(--olive); margin:.2em 0; font-size:1.8rem}
  header p{margin:.2em 0; color:var(--brown); opacity:.8}
  .grid{display:grid; grid-template-columns:340px 1fr; gap:28px; align-items:start}
  @media(max-width:820px){ .grid{grid-template-columns:1fr} }
  .panel{background:#fff; border:1px solid #e4d8c5; border-radius:18px; padding:22px;
    box-shadow:0 10px 30px rgba(111,78,55,.08)}
  .panel h2{font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.1rem; margin:0 0 14px; color:var(--terra)}
  .field{display:block; margin-bottom:14px}
  .field span{display:block; font-size:.82rem; font-weight:600; margin-bottom:5px; color:var(--brown)}
  .field input{width:100%; padding:11px 13px; border:1.5px solid #e0d4c1; border-radius:11px;
    font-family:inherit; font-size:1rem; color:var(--brown); background:#fffdf9; transition:border .15s}
  .field input:focus{outline:none; border-color:var(--sage); box-shadow:0 0 0 3px rgba(138,154,91,.15)}
  .actions{margin-top:6px; display:flex; gap:10px; flex-wrap:wrap}
  button{font-family:'Fredoka',sans-serif; font-weight:600; cursor:pointer; border:none; border-radius:11px;
    padding:11px 16px; font-size:.95rem}
  .btn-primary{background:var(--terra); color:#fff}
  .btn-primary:hover{background:#b65a42}
  .previewbox{background:#fff; border:1px solid #e4d8c5; border-radius:18px; padding:18px; text-align:center;
    box-shadow:0 10px 30px rgba(111,78,55,.08)}
  canvas{max-width:100%; height:auto; border-radius:10px; box-shadow:0 6px 18px rgba(111,78,55,.14)}
  .note{font-size:.78rem; opacity:.7; margin-top:12px; line-height:1.4}
  #status{font-size:.8rem; color:var(--sage); min-height:1em}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Personalizá tu invitación 🦁</h1>
      <p>Escribí los datos y miralos aparecer al instante en tu invitación.</p>
    </header>
    <div class="grid">
      <div class="panel">
        <h2>Tus datos</h2>
        <div id="form"></div>
        <div class="actions">
          <button class="btn-primary" id="btnDownload">Descargar vista previa</button>
        </div>
        <div id="status"></div>
        <p class="note">Esta es una vista previa. Al comprar, recibís el <strong>PDF final en alta calidad</strong>
          (300 DPI, listo para imprimir) generado automáticamente con tus datos.</p>
      </div>
      <div class="previewbox">
        <canvas id="preview" width="1500" height="2100" aria-label="Vista previa de la invitación"></canvas>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
