<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{TITULO}} · Casatridimensional</title>
<meta property="og:title" content="{{TITULO}}">
<meta property="og:description" content="Interactive jigsaw puzzles — put the scenes together and earn stars.">
<meta property="og:image" content="portada.jpg">
<style>
/* ══ Rompecabezas interactivo — Casatridimensional ══
   Mismo lenguaje visual que el cuaderno interactivo: targets ≥76px, drag con
   imán, cero fail states. Colores desde CSS vars (el player las setea con la
   paleta del tema desde data.json) — NO hardcodear colores acá abajo. */
@font-face { font-family: "Baloo";  src: url("f1.ttf?v={{V}}"); font-display: swap; }
@font-face { font-family: "Nunito"; src: url("f2.ttf?v={{V}}"); font-display: swap; }

:root {
  --bg: #FBF4EA; --card: #FFFFFF; --ink: #44372E; --ac: #E0713C;
  --ac2: #4E9C7E; --soft: #F5E4CE; --star: #F2A93B;
  --ok: #3FA65C; --radio: 26px;
  --sombra: 0 4px 14px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.05);
  --sombra-hi: 0 10px 28px rgba(0,0,0,.13), 0 2px 6px rgba(0,0,0,.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: "Nunito", system-ui, sans-serif; font-size: 19px;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  overscroll-behavior-y: contain;
}
img { -webkit-user-drag: none; user-select: none; }
h1, h2, h3, .fx { font-family: "Baloo", "Nunito", sans-serif; font-weight: 600; }

/* ── splash de carga ── */
#cargando {
  position: fixed; inset: 0; background: var(--bg); z-index: 90;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
}
#cargando .aro {
  width: 64px; height: 64px; border-radius: 50%;
  border: 7px solid var(--soft); border-top-color: var(--ac);
  animation: girar 0.9s linear infinite;
}
@keyframes girar { to { transform: rotate(360deg); } }

/* ── header ── */
#hdr {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#hdr .avatar {
  width: 54px; height: 54px; border-radius: 50%; background: var(--soft);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  flex: none; box-shadow: var(--sombra); font-size: 30px;
}
#hdr .avatar img { width: 44px; height: 44px; object-fit: contain; }
#hdrTitulo { flex: 1; min-width: 0; }
#hdrTitulo b { display: block; font-family: "Baloo", sans-serif; font-size: 23px; line-height: 1.05;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hdrTitulo span { font-size: 14px; opacity: .65; }
.pill {
  display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 16px;
  background: var(--card); border-radius: 999px; box-shadow: var(--sombra);
  font-family: "Baloo", sans-serif; font-size: 21px; border: none; color: var(--ink);
}
button.pill:active, a.pill:active { transform: scale(.94); }
#btnBiblioteca { text-decoration: none; }
#btnAtras { display: none; }
#btnAtras.ver { display: flex; }

/* ── escenario ── */
#stage { max-width: 1020px; margin: 0 auto;
  padding: 10px 16px calc(72px + env(safe-area-inset-bottom)); }
#stage.jugando { max-width: 1280px; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }

/* portada del menú */
#bienvenida { text-align: center; padding: 14px 8px 22px; }
#bienvenida h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.06; }
#bienvenida p { opacity: .7; margin-top: 4px; font-size: 17px; }

/* menú de rompecabezas (uno por escena del tema) */
#menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 16px; }
.carta {
  background: var(--card); border: none; border-radius: var(--radio);
  box-shadow: var(--sombra); padding: 10px 10px 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: var(--ink); transition: transform .12s ease, box-shadow .12s ease;
  position: relative;
}
.carta:active { transform: scale(.95); }
@media (hover:hover) { .carta:hover { transform: translateY(-4px); box-shadow: var(--sombra-hi); } }
.carta .foto {
  width: 100%; aspect-ratio: 1; border-radius: 18px; background: var(--soft);
  overflow: hidden; display: flex; align-items: center; justify-content: center;
}
.carta .foto img { width: 100%; height: 100%; object-fit: cover; }
.carta .nombre { font-family: "Baloo", sans-serif; font-size: 19px; line-height: 1.1; text-align: center; }
.carta .mini-est { font-size: 15px; letter-spacing: 2px; min-height: 20px; }
/* MODO DEMO: rompecabezas bloqueados (mitad) + banner de compra */
.carta--lock .foto { position: relative; filter: grayscale(.55); }
.carta--lock .lock-ov { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 40px; background: rgba(0,0,0,.28); }
.carta--lock .mini-est { color: var(--ac, #7a5cd0); font-weight: 700; letter-spacing: 0; }
.demo-banner { background: #fff8e1; border: 2px solid #ffd54f; border-radius: 14px; padding: 10px 14px; margin: 0 auto 16px; max-width: 640px; font-size: 15px; line-height: 1.4; text-align: center; color: #5b4a00; }
.demo-banner a { font-weight: 800; white-space: nowrap; color: #7a5cd0; }

/* elección de nivel (cantidad de piezas) */
#niveles { display: flex; flex-direction: column; gap: 18px; align-items: center; }
#niveles .foto {
  width: min(320px, 70vw); border-radius: var(--radio); overflow: hidden; box-shadow: var(--sombra);
}
#niveles .foto img { display: block; width: 100%; }
#niveles h2 { font-size: clamp(24px, 5vw, 32px); text-align: center; }
#nivelBtns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.nivelBtn {
  border: none; cursor: pointer; background: var(--card); color: var(--ink);
  border-radius: 24px; box-shadow: var(--sombra); min-width: 132px; min-height: 108px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-family: "Baloo", sans-serif; transition: transform .12s ease;
}
.nivelBtn:active { transform: scale(.94); }
.nivelBtn .n { font-size: 40px; line-height: 1; }
.nivelBtn .t { font-size: 16px; opacity: .7; }
.nivelBtn .est { font-size: 14px; letter-spacing: 2px; min-height: 18px; }
/* MODO DEMO: niveles con más piezas de las permitidas */
.nivelBtn--lock { filter: grayscale(.55); opacity: .88; }
.nivelBtn--lock .n { font-size: 30px; }
.nivelBtn--lock .est { color: var(--ac, #7a5cd0); font-weight: 700; letter-spacing: 0; }

/* ── el juego ── */
#juego { position: relative; }
#lienzo { display: block; width: 100%; touch-action: none; border-radius: var(--radio); }
#barraJuego { display: flex; align-items: center; gap: 10px; justify-content: center;
  margin-top: 10px; flex-wrap: wrap; }
#barraJuego .estado { font-family: "Baloo", sans-serif; font-size: 20px;
  background: var(--card); border-radius: 999px; padding: 8px 20px; box-shadow: var(--sombra); }
.btn {
  border: none; cursor: pointer; color: #fff; background: var(--ac);
  font-family: "Baloo", sans-serif; font-size: 20px; min-height: 52px;
  padding: 6px 22px; border-radius: 999px; box-shadow: var(--sombra);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { transform: scale(.95); }
.btn.suave { background: var(--card); color: var(--ink); }
.btn.verde { background: var(--ok); }

/* ── animaciones ── */
@keyframes pop     { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes brinco  { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-16%); } }
@keyframes latido  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
.anim-pop { animation: pop .35s ease both; }

/* ── festejo ── */
#festejo {
  position: fixed; inset: 0; z-index: 60; display: none;
  align-items: center; justify-content: center; padding: 22px;
  background: color-mix(in srgb, var(--ink) 32%, transparent);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
#festejo.ver { display: flex; }
#festejo .caja {
  background: var(--card); border-radius: 34px; box-shadow: var(--sombra-hi);
  padding: 30px 26px 26px; text-align: center; max-width: 430px; width: 100%;
}
#festejo .masco { width: 130px; height: 130px; object-fit: contain; animation: brinco .8s ease infinite; }
#festejo .mascoEmoji { font-size: 92px; line-height: 130px; animation: brinco .8s ease infinite; }
#festejo h2 { font-size: 34px; margin: 6px 0 2px; }
#festejo .frase { opacity: .75; font-size: 18px; margin-bottom: 10px; }
#festejo .estrellas { font-size: 52px; letter-spacing: 6px; min-height: 64px; }
#festejo .estrellas span { display: inline-block; opacity: 0; }
#festejo .estrellas span.gana { animation: pop .5s ease both; }
#festejo .botones { display: flex; gap: 12px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }

/* confeti */
#confeti { position: fixed; inset: 0; z-index: 55; pointer-events: none; }

/* feedback flotante ("¡muy bien!") */
#toast {
  position: fixed; left: 50%; bottom: 12vh; transform: translateX(-50%);
  z-index: 50; pointer-events: none; opacity: 0;
  font-family: "Baloo", sans-serif; font-size: 34px; color: #fff;
  background: var(--ok); padding: 10px 30px; border-radius: 999px; box-shadow: var(--sombra-hi);
}
#toast.ver { animation: toastAnim 1.1s ease both; }
@keyframes toastAnim {
  0% { opacity: 0; transform: translateX(-50%) translateY(18px) scale(.8); }
  18% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.04); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(-14px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; }
}
@media (max-width: 560px) {
  #menu { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  #stage { padding: 6px 10px calc(64px + env(safe-area-inset-bottom)); }
  #stage.jugando { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  body { font-size: 17px; }
  #hdr { padding: calc(6px + env(safe-area-inset-top)) 10px 6px; gap: 8px; }
  #hdr .avatar { width: 44px; height: 44px; font-size: 24px; }
  #hdr .avatar img { width: 36px; height: 36px; }
  #hdrTitulo b { font-size: 19px; }
  #hdrTitulo span { display: none; }
  .pill { height: 42px; padding: 0 12px; font-size: 18px; }
  .nivelBtn { min-width: 108px; min-height: 96px; }
  #barraJuego .estado { font-size: 17px; padding: 6px 14px; }
  .btn { font-size: 17px; min-height: 46px; padding: 4px 14px; }
}
</style>
</head>
<body>
<div id="cargando"><div class="aro"></div><div class="fx" style="font-size:22px" id="txtCargando">Preparando tus rompecabezas…</div></div>

<header id="hdr">
  <a href="https://casatridimensional.com.ar/mi-cuenta" class="pill" id="btnBiblioteca" aria-label="Volver a Mi biblioteca">📚</a>
  <button id="btnAtras" class="pill" aria-label="Volver">←</button>
  <div class="avatar" id="avatar">🧩</div>
  <div id="hdrTitulo"><b id="hdrNombre">¡Hola!</b><span id="hdrSub"></span></div>
  <div class="pill" id="hdrEstrellas" aria-label="Estrellas ganadas">⭐ <span id="totalEstrellas">0</span></div>
  <button id="btnSonido" class="pill" aria-label="Sonido">🔊</button>
</header>

<main id="stage"></main>

<div id="toast"></div>
<canvas id="confeti"></canvas>

<div id="festejo" role="dialog" aria-modal="true">
  <div class="caja">
    <div id="mascoFestejo"></div>
    <h2 id="festejoTitulo">¡Muy bien!</h2>
    <div class="frase" id="festejoFrase"></div>
    <div class="estrellas" id="festejoEstrellas"></div>
    <div class="botones">
      <button class="btn suave" id="btnOtraVez">🔁 Otra vez</button>
      <button class="btn verde" id="btnSeguir">¡Seguir!</button>
    </div>
  </div>
</div>

<script>window.DV = "{{DV}}"; window.IDIOMA = "{{IDIOMA}}";</script>
<script src="player.js?v={{V}}"></script>
</body>
</html>
