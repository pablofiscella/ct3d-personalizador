<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{{TITULO}}</title>
<style>
  :root{
    --bg:#f6f1e7; --card:#fffdf8; --ink:#3a3330; --muted:#8a807a;
    --ac:#c8674e; --ac2:#6b7a4f; --line:#e7ddcd; --shadow:0 6px 22px rgba(60,40,20,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; min-height:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:var(--bg); overscroll-behavior:none;
    min-height:100dvh; display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:12px; padding:12px 16px; flex:0 0 auto;
    background:var(--card); border-bottom:1px solid var(--line); z-index:5;
  }
  header h1{font-size:19px; margin:0; font-weight:800; letter-spacing:.2px; flex:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .btn{
    border:none; border-radius:14px; padding:11px 15px; font-size:15px; font-weight:700;
    cursor:pointer; background:var(--line); color:var(--ink); min-height:46px;
  }
  .btn.ac{background:var(--ac); color:#fff}
  .btn.gh{background:transparent; border:1.5px solid var(--line); flex:0 1 auto; max-width:150px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .wrap{flex:1 1 auto; max-width:640px; margin:0 auto; width:100%; padding:18px 16px 32px}
  .escena-box{background:var(--card); border:1px solid var(--line); border-radius:18px;
    box-shadow:var(--shadow); overflow:hidden; margin-bottom:18px}
  .escena-box img{width:100%; display:block; aspect-ratio:4/3; object-fit:cover; background:var(--line)}
  #texto{font-size:18px; line-height:1.55; margin:0 0 20px}
  #final-badge{display:none; text-align:center; font-weight:800; color:var(--ac2);
    font-size:15px; letter-spacing:.3px; margin-bottom:14px}
  #opciones{display:flex; flex-direction:column; gap:12px}
  .btn.op{white-space:normal; line-height:1.3; text-align:left; padding:14px 16px}
  #reiniciar{display:none; width:100%; margin-top:6px}
  @media (prefers-color-scheme:dark){
    :root{--bg:#221f1c; --card:#2c2825; --ink:#efe7dc; --muted:#a89e93; --line:#3c352f}
  }
</style>
</head>
<body>
<header>
  <a class="btn gh" href="https://casatridimensional.com.ar/mi-cuenta">← Mi biblioteca</a>
  <h1 id="titulo">{{TITULO}}</h1>
</header>

<div class="wrap">
  <div class="escena-box"><img id="escena" alt=""></div>
  <p id="final-badge">🌟 ¡Fin de esta aventura!</p>
  <p id="texto"></p>
  <div id="opciones"></div>
  <button class="btn ac" id="reiniciar">🔁 Empezar de nuevo</button>
</div>

<script>
  window.AVENTURA_INICIO = {{INICIO}};
  window.AVENTURA_NODOS = {{NODOS}};
</script>
<script src="player.js?v={{V}}"></script>
</body>
</html>
